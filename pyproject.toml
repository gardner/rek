[project]
name = "tscribe"
version = "0.1.0"
description = "Local audio recording and speaker-labelled transcription with Nemotron and Whisper"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "librosa>=1.0.0",
    "numpy>=2.5.3",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
tscribe = "tscribe:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90", "ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["main.py", "src", "scripts"]
typeCheckingMode = "basic"
strict = ["src/tscribe/transcript.py"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
