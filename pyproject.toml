[project]
name = "gk"
version = "0.1.0"
description = "Local English transcription and speaker diarization with ONNX Runtime"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=1.33.0",
    "librosa>=1.0.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.31.1",
    "sherpa-onnx>=2.0.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.urls]
Repository = "https://github.com/gardner/gkit"
Issues = "https://github.com/gardner/gkit/issues"

[project.scripts]
gk = "gk:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90", "ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["main.py", "src", "scripts"]
typeCheckingMode = "basic"
strict = ["src/gk/transcript.py"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
